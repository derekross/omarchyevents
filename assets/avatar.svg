<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Omarchy Events avatar. Tokyo Night palette; a calendar page whose grid is a tiling desktop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- faint tiling-grid texture -->
  <g stroke="#414868" stroke-opacity="0.28" stroke-width="2">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>

  <!-- calendar card -->
  <g transform="translate(152 176)">
    <rect x="0" y="0" width="720" height="672" rx="56" fill="#1a1b26" stroke="#414868" stroke-width="6"/>
    <!-- header bar -->
    <path d="M0 56 A56 56 0 0 1 56 0 H664 A56 56 0 0 1 720 56 V150 H0 Z" fill="url(#bar)"/>
    <!-- binder rings -->
    <g fill="#1a1b26" stroke="#c0caf5" stroke-width="14">
      <rect x="150" y="-52" width="44" height="120" rx="22"/>
      <rect x="526" y="-52" width="44" height="120" rx="22"/>
    </g>
    <!-- window tiles: a Hyprland-style layout as the month grid -->
    <g>
      <rect x="56" y="206" width="300" height="410" rx="22" fill="#24283b" stroke="#7aa2f7" stroke-width="6"/>
      <rect x="388" y="206" width="276" height="196" rx="22" fill="#24283b" stroke="#414868" stroke-width="6"/>
      <rect x="388" y="420" width="276" height="196" rx="22" fill="#24283b" stroke="#414868" stroke-width="6"/>
      <!-- terminal prompt in the focused tile -->
      <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-weight="700">
        <text x="96" y="300" font-size="72" fill="#9ece6a">&gt;</text>
        <text x="146" y="300" font-size="72" fill="#c0caf5">_</text>
      </g>
      <!-- event dots -->
      <g filter="url(#glow)">
        <circle cx="446" cy="304" r="26" fill="#f7768e"/>
        <circle cx="526" cy="304" r="26" fill="#e0af68"/>
        <circle cx="606" cy="304" r="26" fill="#9ece6a"/>
        <circle cx="446" cy="518" r="26" fill="#7dcfff"/>
        <circle cx="526" cy="518" r="26" fill="#bb9af7"/>
        <circle cx="606" cy="518" r="26" fill="#ff9e64"/>
      </g>
      <!-- text lines in focused tile -->
      <g fill="#565f89">
        <rect x="96" y="360" width="200" height="16" rx="8"/>
        <rect x="96" y="404" width="150" height="16" rx="8"/>
        <rect x="96" y="448" width="180" height="16" rx="8"/>
      </g>
      <!-- location pin, accent -->
      <g transform="translate(206 470)">
        <path d="M0 -6 C-46 -6 -70 26 -70 58 C-70 100 0 156 0 156 C0 156 70 100 70 58 C70 26 46 -6 0 -6Z" fill="#7aa2f7"/>
        <circle cx="0" cy="56" r="26" fill="#1a1b26"/>
      </g>
    </g>
  </g>
</svg>
